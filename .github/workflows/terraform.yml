# .github/workflows/terraform.yml - Check every stack, then plan and apply main.

name: terraform

# Pushes and pull requests into main, or a manual run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the stack job adds the OIDC token it needs
permissions:
  contents: read

jobs:
  # Formatting, validation, lint, misconfiguration, and secret checks; no AWS access
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history so gitleaks scans every commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # The same checks people run locally
      - run: make check

  # github is plan only: the role can't change IAM, so that stack is applied by hand
  stack:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Each stack in its own job; one failing doesn't cancel the other
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: site
            apply: true
          - stack: github
            apply: false

    # One run per stack at a time, and never cancel an apply halfway
    concurrency:
      group: terraform-${{ matrix.stack }}
      cancel-in-progress: false

    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Short-lived credentials through GitHub OIDC; the role trusts only this repo's main branch
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      # Plan every stack; apply only the ones marked apply. The expected account is the role's own,
      # so credentials that resolve anywhere else stop the run before Terraform starts
      - run: make plan STACK=${{ matrix.stack }} EXPECTED_ACCOUNT="$(echo "$ROLE" | cut -d: -f5)"
        env:
          ROLE: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}

      - if: matrix.apply
        run: make apply STACK=${{ matrix.stack }} EXPECTED_ACCOUNT="$(echo "$ROLE" | cut -d: -f5)"
        env:
          ROLE: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
