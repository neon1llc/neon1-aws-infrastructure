# .github/workflows/terraform.yml - Check every stack, then plan and apply main.

name: terraform

# Plans every stack on PRs and manual runs; main applies only site and DNS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

# Read-only by default; the stack job adds the OIDC token it needs
permissions:
  contents: read

jobs:
  # Formatting, validation, lint, misconfiguration, and secret checks; no AWS access
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history so gitleaks scans every commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # The same checks people run locally
      - run: make check

      # The changelog names the release this commit belongs to
      - name: Check the release number
        run: |
          top=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          [ -n "$top" ] || { echo "::error::CHANGELOG.md names no version"; exit 1; }
          echo "release v$top"

  # Plan each stack from the event commit; only the existing main push path applies site and DNS
  stack:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Each stack in its own job; one failing doesn't cancel the other
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: account
            apply: false
          - stack: catchall
            apply: false
          - stack: site-dev
            apply: false
          - stack: site
            apply: true
          - stack: dns
            apply: true
          - stack: github
            apply: false

    # One run per stack at a time, and never cancel an apply halfway
    concurrency:
      group: terraform-${{ matrix.stack }}
      cancel-in-progress: false

    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Short-lived credentials through GitHub OIDC; PR and non-main refs need an approved trust update
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      # Keep raw plans in the runner temp directory and publish only resource addresses and actions
      - name: Plan ${{ matrix.stack }}
        id: plan
        shell: bash
        env:
          STACK: ${{ matrix.stack }}
          EXPECTED_ACCOUNT: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          set -euo pipefail
          account=$(printf '%s' "$EXPECTED_ACCOUNT" | cut -d: -f5)
          test "${#account}" -eq 12 || { echo 'Could not read the account from the role ARN'; exit 1; }
          actual=$(aws sts get-caller-identity --query Account --output text)
          test "$actual" = "$account" || { echo 'Credentials resolved to a different account'; exit 1; }
          terraform -chdir="$STACK" init -input=false -no-color >/dev/null
          set +e
          terraform -chdir="$STACK" plan -input=false -no-color -detailed-exitcode \
            -var "expected_account_id=$account" -out="$RUNNER_TEMP/$STACK.tfplan" \
            >"$RUNNER_TEMP/$STACK-plan.log" 2>&1
          result=$?
          set -e
          if [ "$result" -gt 2 ]; then
            echo "Terraform plan failed for $STACK; see the job status without printing raw plan output."
            exit "$result"
          fi
          terraform -chdir="$STACK" show -json "$RUNNER_TEMP/$STACK.tfplan" \
            | jq -r --arg stack "$STACK" '
                [.resource_changes[]?.change.actions] as $changes
                | ([ $changes[] | select(index("create") != null) ] | length) as $add
                | ([ $changes[] | select(index("update") != null) ] | length) as $change
                | ([ $changes[] | select(index("delete") != null) ] | length) as $destroy
                | "## \($stack)\n\n\($add) to add, \($change) to change, \($destroy) to destroy."
                  + (if ($changes | length) == 0 then " No differences from the applied state."
                     else "\n\n" + ([.resource_changes[]? | select(.change.actions != ["no-op"]) | "- `\(.address)`: `\(.change.actions | join(" then "))`"] | join("\n")) end)
              ' >> "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.apply
        run: |
          make apply STACK=${{ matrix.stack }} EXPECTED_ACCOUNT="$(echo "$ROLE" | cut -d: -f5)"
        env:
          ROLE: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}

  # Every released version gets an annotated tag on the commit that was applied, once every stack
  # has passed. The version is the changelog's top entry; a push that doesn't add one ships under the last tag
  tag:
    needs: stack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version" "$GITHUB_SHA"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$version"
            echo "tagged v$version" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The release's notes on GitHub are its changelog entry, so the Releases page reads newest first.
      # A failure here only warns: the release is already live and tagged
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$version already has release notes"; exit 0; fi
          awk -v v="v$version" '$0 ~ "^## "v"( |$)" {f=1; if ($4) print "Released "$4"."; next} /^## / {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" -R "$GITHUB_REPOSITORY" --verify-tag --title "v$version" --notes-file "$RUNNER_TEMP/notes.md" \
            || echo "::warning::v$version has no release notes yet"
